<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Halation Studio Micro Graphic Preview</title>
    <style>
      :root {
        --paper: #f4f0e9;
        --ink: #161412;
        --muted: #5e554d;
        --line: rgba(22, 20, 18, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(900px, calc(100vw - 40px));
        display: grid;
        gap: 34px;
      }

      .stage {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--line);
      }

      .panel {
        min-height: 360px;
        display: grid;
        place-items: center;
        padding: 48px;
      }

      .panel:first-child {
        background: #fffbf4;
      }

      .panel:last-child {
        background: #161412;
      }

      .large-mark {
        width: min(280px, 58vw);
        height: auto;
      }

      .small-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        border: 1px solid var(--line);
      }

      .small-row img:nth-child(1) {
        width: 96px;
      }

      .small-row img:nth-child(2) {
        width: 56px;
      }

      .small-row img:nth-child(3) {
        width: 32px;
      }

      .caption {
        margin: 0;
        color: var(--muted);
        text-align: center;
        font-size: 0.76rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .option {
        display: grid;
        gap: 16px;
        justify-items: center;
        padding: 26px 18px;
        border: 1px solid var(--line);
        background: #fffbf4;
      }

      .option svg {
        width: 116px;
        height: 116px;
      }

      .option strong {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: 1.05rem;
      }

      .option span {
        max-width: 180px;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.5;
        text-align: center;
      }

      @media (max-width: 700px) {
        .stage {
          grid-template-columns: 1fr;
        }

        .panel {
          min-height: 260px;
        }

        .options {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stage">
        <div class="panel">
          <img class="large-mark" src="/halation-micro-graphic.svg" alt="Halation Studio micro graphic on light paper" />
        </div>
        <div class="panel">
          <img class="large-mark" src="/halation-micro-graphic.svg" alt="Halation Studio micro graphic on dark background" />
        </div>
      </div>
      <div class="small-row" aria-label="Small size previews">
        <img src="/halation-micro-graphic.svg" alt="Large small-size preview" />
        <img src="/halation-micro-graphic.svg" alt="Medium small-size preview" />
        <img src="/halation-micro-graphic.svg" alt="Tiny small-size preview" />
      </div>
      <section class="options" aria-label="Cleaner concept directions">
        <article class="option">
          <svg viewBox="0 0 160 160" fill="none" aria-hidden="true">
            <rect width="160" height="160" rx="28" fill="#F4F0E9" />
            <circle cx="80" cy="80" r="48" fill="#FFFAF1" />
            <circle cx="80" cy="80" r="38" stroke="#B7A98F" stroke-width="4" opacity="0.6" />
            <path d="M57 104L80 52L103 104" stroke="#161412" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M66 84H94" stroke="#161412" stroke-width="6" stroke-linecap="round" />
            <circle cx="80" cy="80" r="6" fill="#161412" />
          </svg>
          <strong>Halo A</strong>
          <span>Simple monogram. Best for favicon, watermark, and tiny footer use.</span>
        </article>
        <article class="option">
          <svg viewBox="0 0 160 160" fill="none" aria-hidden="true">
            <rect width="160" height="160" rx="28" fill="#161412" />
            <circle cx="80" cy="80" r="48" fill="#F4F0E9" />
            <path d="M49 80C49 63 63 49 80 49C97 49 111 63 111 80C111 97 97 111 80 111C63 111 49 97 49 80Z" stroke="#B7A98F" stroke-width="5" />
            <path d="M56 103L80 55L104 103" stroke="#161412" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M67 85H93" stroke="#161412" stroke-width="6" stroke-linecap="round" />
          </svg>
          <strong>Dark Stamp</strong>
          <span>More like a production stamp for thumbnails and video end cards.</span>
        </article>
        <article class="option">
          <svg viewBox="0 0 160 160" fill="none" aria-hidden="true">
            <rect width="160" height="160" rx="28" fill="#F4F0E9" />
            <path d="M44 44H116V116H44V44Z" stroke="#161412" stroke-width="6" />
            <path d="M62 44V116M98 44V116" stroke="#161412" stroke-width="3" opacity="0.4" />
            <circle cx="80" cy="80" r="24" stroke="#B7A98F" stroke-width="5" />
            <path d="M66 101L80 59L94 101" stroke="#161412" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M72 84H88" stroke="#161412" stroke-width="5" stroke-linecap="round" />
          </svg>
          <strong>Film Mark</strong>
          <span>Most literal. It says film faster, but is less elegant when tiny.</span>
        </article>
      </section>
      <p class="caption">Current file uses Halo A</p>
    </main>
  </body>
</html>
